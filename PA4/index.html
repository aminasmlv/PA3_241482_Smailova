<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>PA4 - 241482</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="components.js"></script>
</head>

<body>

  <a-scene
    fog="type: linear; color: #0b3d4d; near: 5; far: 25"
    stats>

    <a-assets>
    </a-assets>

    <a-sky color="#0b5366"></a-sky>

    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="12"
      height="16"
      color="#456b70">
    </a-plane>

    <a-entity
      light="type: ambient; color: #8fbfc7; intensity: 0.7">
    </a-entity>

    <a-entity
      light="type: directional; color: #ffffff; intensity: 0.8"
      position="-2 4 1">
    </a-entity>


    <!-- CAMERA -->

    <a-entity
      id="rig"
      position="0 0 6"
      wasd-controls>

      <a-entity
        camera
        look-controls
        position="0 1.6 0">

        <a-cursor
          id="cursor"
          fuse="true"
          fuse-timeout="1500"
          raycaster="objects: .exhibit"
          geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.013"
          material="color: white; shader: flat">
        </a-cursor>


        <!-- INFO PANEL -->

        <a-entity
          id="info-panel"
          position="-0.65 0.55 -1.5">

          <a-plane
            width="1.25"
            height="0.55"
            color="#062f3a"
            opacity="0.85">
          </a-plane>

          <a-text
            id="info-text"
            value="ID: 241482\nTheme: Underwater Research Base\nMotion: Pulse\nInteraction: Gaze\nLayout: Corridor\nSelected: none (0 of 6)"
            color="#ffffff"
            width="1.15"
            position="-0.57 0.20 0.01"
            align="left">
          </a-text>

        </a-entity>

      </a-entity>

    </a-entity>


    <!-- WATER SAMPLE -->

    <a-cylinder
      class="exhibit"
      id="water-sample"
      x1482-motion="type: pulse; amplitude: 0.10; period: 2500; phase: 0"
      x1482-exhibit="name: Water Sample"
      position="-1.5 0.75 2"
      radius="0.35"
      height="1.5"
      color="#62d8e8">

      <a-text
        value="Water Sample"
        align="center"
        width="3"
        position="0 1.15 0">
      </a-text>

    </a-cylinder>


    <!-- SEA ROCK -->

    <a-sphere
      class="exhibit"
      id="sea-rock"
      x1482-motion="type: pulse; amplitude: 0.10; period: 2500; phase: 1"
      x1482-exhibit="name: Sea Rock Sample"
      position="1.5 0.65 2"
      radius="0.65"
      color="#708090">

      <a-text
        value="Sea Rock Sample"
        align="center"
        width="3"
        position="0 1.15 0">
      </a-text>

    </a-sphere>


    <!-- RESEARCH BOX -->

    <a-entity
      class="exhibit"
      id="equipment-box"
      x1482-motion="type: pulse; amplitude: 0.10; period: 2500; phase: 2"
      x1482-exhibit="name: Research Box"
      position="-1.5 0.6 -1"
      geometry="primitive: box; width: 1; height: 1.2; depth: 1"
      material="color: #d18b47">

      <a-text
        value="Research Box"
        align="center"
        width="3"
        position="0 1.1 0.51">
      </a-text>

    </a-entity>


    <!-- AIR TANK -->

    <a-cylinder
      class="exhibit"
      id="air-tank"
      x1482-motion="type: pulse; amplitude: 0.10; period: 2500; phase: 3"
      x1482-exhibit="name: Air Tank"
      position="1.5 0.9 -1"
      radius="0.4"
      height="1.8"
      color="#d9e2e8">

      <a-text
        value="Air Tank"
        color="#ffffff"
        align="center"
        width="3"
        position="0 1.3 0">
      </a-text>

    </a-cylinder>


    <!-- SEA PLANT -->

    <a-cone
      class="exhibit"
      id="sea-plant"
      x1482-motion="type: pulse; amplitude: 0.10; period: 2500; phase: 4"
      x1482-exhibit="name: Sea Plant Sample"
      position="-1.5 0.75 -4"
      radius-bottom="0.6"
      radius-top="0.1"
      height="1.5"
      color="#4fa66d">

      <a-text
        value="Sea Plant Sample"
        align="center"
        width="3"
        position="0 1.2 0">
      </a-text>

    </a-cone>


    <!-- OBSERVATION BUOY -->

    <a-sphere
      class="exhibit"
      id="observation-buoy"
      x1482-motion="type: pulse; amplitude: 0.10; period: 2500; phase: 5"
      x1482-exhibit="name: Observation Buoy"
      position="1.5 0.7 -4"
      radius="0.7"
      color="#e3b341">

      <a-text
        value="Observation Buoy"
        align="center"
        width="3"
        position="0 1.2 0">
      </a-text>

    </a-sphere>

  </a-scene>

</body>

</html>
